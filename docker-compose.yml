version: '3.8'

services:
  # Сервіс бази даних PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: barbershop_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bdjilka1610
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./server/backup.sql:/docker-entrypoint-initdb.d/backup.sql
      - pgdata:/var/lib/postgresql/data

  # Сервіс нашого бекенду (Node.js)
  server:
    build: ./server
    container_name: barbershop_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=host.docker.internal
      - DB_USER=postgres
      - DB_PASSWORD=bdjilka1610
      - DB_NAME=postgres
      - DB_PORT=5432
    depends_on:
      - postgres_db

volumes:
  pgdata: